<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>VN-ALPR</title>
  <!-- neobrutalism tile: yellow, thick black border, hard offset shadow (same as the UI) -->
  <rect x="7" y="7" width="54" height="54" rx="10" fill="#000"/>
  <rect x="3" y="3" width="54" height="54" rx="10" fill="#ffdc58" stroke="#000" stroke-width="4"/>
  <!-- camera viewfinder corners -->
  <path d="M11 20v-7h7M49 20v-7h-7M11 40v7h7M49 40v7h-7" fill="none" stroke="#000" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2-line VN plate: series on top, number below -->
  <rect x="17" y="18" width="26" height="24" rx="3" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <rect x="22" y="23" width="16" height="4.5" rx="1" fill="#000"/>
  <rect x="21" y="32" width="18" height="5" rx="1" fill="#000"/>
  <!-- scan line -->
  <path d="M13 30h34" stroke="#e63946" stroke-width="2.5" stroke-linecap="round"/>
</svg>
