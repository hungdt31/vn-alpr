# docker compose up --build   ->  http://localhost:8080 (web UI + API, docs at /docs)
# Put trained weights in ./models (detector/best.pt, crnn/best.pt) before building: they go into the image.
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      ALPR_DB: /app/data/alpr.db
    volumes:
      - ./data/docker:/app/data   # keeps the database and gate snapshots between restarts
