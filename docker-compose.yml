# docker compose up --build   ->  API http://localhost:8000/docs  (web UI: cd web && npm run dev)
# Put trained weights in ./models (detector/best.pt, crnn/best.pt) before starting.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ALPR_CONFIG: configs/pipeline.yaml
      ALPR_DB: /app/data/alpr.db
    volumes:
      - ./models:/app/models:ro
      - ./data/db:/app/data
