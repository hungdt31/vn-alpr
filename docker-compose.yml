# docker compose up --build   ->  API http://localhost:8000/docs , UI http://localhost:8501
# Put trained weights in ./models (detector/best.pt, crnn/best.pt) before starting.
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      ALPR_CONFIG: configs/pipeline.yaml
      ALPR_DB: /app/data/alpr.db
    volumes:
      - ./models:/app/models:ro
      - ./data/db:/app/data

  ui:
    build: .
    command: ["streamlit", "run", "app/ui/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
    environment:
      ALPR_CONFIG: configs/pipeline.yaml
      ALPR_DB: /app/data/alpr.db
    volumes:
      - ./models:/app/models:ro
      - ./data/db:/app/data
