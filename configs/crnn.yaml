# CRNN line recognizer training
train_dirs:
  - data/synthetic/ocr       # pre-training data from scripts/gen_synthetic.py
  - data/processed/ocr/train # real crops from scripts/make_ocr_crops.py
val_dirs:
  - data/processed/ocr/val
img_h: 32
img_w: 128
hidden: 128
epochs: 40
batch_size: 128
lr: 0.001
weight_decay: 0.0001
num_workers: 2
augment: true
out: models/crnn/best.pt
